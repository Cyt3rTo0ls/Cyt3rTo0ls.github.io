<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
    <title>Cyt3rTools | Admin Secure Portal</title>
    <style>
        :root {
            --bg: #0a0000;
            --card: #110000;
            --border: #330000;
            --red: #cc0000;
            --darkred: #880000;
            --text: #cccccc;
            --white: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; line-height: 1.6; min-height: 100vh; padding: 40px 20px; }
        
        .admin-container { max-width: 1100px; margin: 0 auto; background: var(--card); border: 1px solid var(--border); padding: 30px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 25px; }
        .admin-header h2 { color: var(--red); font-size: 20px; text-transform: uppercase; letter-spacing: 1px; }
        .admin-stats { font-size: 13px; color: #888; background: #180000; padding: 8px 15px; border: 1px solid var(--border); }
        
        .login-box { max-width: 400px; margin: 100px auto; background: var(--card); border: 1px solid var(--border); padding: 40px; text-align: center; }
        .login-box h2 { color: var(--red); font-size: 20px; margin-bottom: 20px; text-transform: uppercase; }
        .login-box input { width: 100%; background: #0a0000; border: 1px solid var(--border); padding: 12px; margin-bottom: 15px; color: #fff; font-size: 13px; outline: none; user-select: text; }
        .login-box input:focus { border-color: var(--red); }
        .login-box button { width: 100%; background: var(--red); border: none; color: #fff; padding: 12px; font-weight: bold; text-transform: uppercase; cursor: pointer; }
        .login-box button:hover { background: var(--darkred); }
        .error-msg { color: var(--red); font-size: 12px; margin-top: 10px; display: none; }

        .ticket-list { display: flex; flex-direction: column; gap: 15px; }
        .ticket-card { background: #0d0000; border: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .ticket-info { display: flex; justify-content: space-between; font-size: 12px; color: #777; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .ticket-msgs { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 10px 0; user-select: text; }
        .ticket-actions { display: flex; gap: 10px; margin-top: 10px; }
        .ticket-actions input { flex: 1; background: #110000; border: 1px solid var(--border); padding: 8px 12px; color: #fff; font-size: 12px; outline: none; user-select: text; }
        .ticket-actions button { background: var(--red); border: none; color: #fff; padding: 8px 16px; cursor: pointer; font-size: 11px; text-transform: uppercase; font-weight: bold; }
        .badge { padding: 3px 8px; font-size: 10px; text-transform: uppercase; font-weight: bold; }
        .badge.open { background: #220000; color: #ff4444; border: 1px solid var(--red); }
        .badge.closed { background: #111; color: #666; border: 1px solid #333; }
        
        .btn { padding: 8px 15px; border-radius: 2px; text-decoration: none; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; border: 1px solid var(--red); color: var(--red); background: transparent; cursor: pointer; }
        .btn:hover { background: var(--red); color: #fff; }
    </style>
</head>
<body>

<div id="loginSection" class="login-box">
    <h2>Panel Administrativo</h2>
    <input type="text" id="adminUser" placeholder="Usuario" autocomplete="off">
    <input type="password" id="adminPass" placeholder="Contraseña">
    <button onclick="authAdmin()">Acceder</button>
    <div id="errorMsg" class="error-msg">Acceso denegado o IP bloqueada temporalmente.</div>
</div>

<div id="dashboardSection" class="admin-container" style="display:none;">
    <div class="admin-header">
        <h2>Panel de Control / Soporte Operativo</h2>
        <div style="display: flex; gap: 15px; align-items: center;">
            <div class="admin-stats" id="tokenStats">Tokens hoy: 0 / 25</div>
            <button class="btn" onclick="logoutAdmin()">Cerrar Sesión</button>
        </div>
    </div>
    <div class="ticket-list" id="ticketListContainer"></div>
</div>

<script>
    /* MEDIDAS ANTI-HACKING Y RATE LIMITING PROGRESIVO */
    (function(){
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', (e) => {
            if(e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) || (e.ctrlKey && e.key.toUpperCase() === 'U')){
                e.preventDefault();
            }
        });

        // Credenciales ofuscadas en Base64
        const _uEnc = "am9zM3J0"; // jos3rt
        const _pEnc = "Jos3RT_x@xa="; // Decodificación base64 segura
        const STORAGE_TICKETS = "secure_user_tickets";
        const ATTEMPTS_KEY = "admin_login_attempts";
        const LOCK_KEY = "admin_lock_until";

        function _atobSafe(s) {
            try { return atob(s.replace(/=+$/, '')); } catch(e) { return ""; }
        }

        window.authAdmin = function(){
            let now = Date.now();
            let lockUntil = parseInt(localStorage.getItem(LOCK_KEY) || '0');
            
            if(now < lockUntil){
                let remainingMins = Math.ceil((lockUntil - now) / 60000);
                document.getElementById('errorMsg').textContent = `Bloqueo de seguridad activo. Intente en ${remainingMins} min.`;
                _showErr();
                return;
            }

            const u = document.getElementById('adminUser').value.trim();
            const p = document.getElementById('adminPass').value.trim();

            // Comparación estricta
            if(u === "jos3rt" && p === "Jos3RT_x@xa"){
                localStorage.setItem(ATTEMPTS_KEY, '0');
                localStorage.removeItem(LOCK_KEY);
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                _renderDashboard();
            } else {
                let attempts = parseInt(localStorage.getItem(ATTEMPTS_KEY) || '0') + 1;
                localStorage.setItem(ATTEMPTS_KEY, attempts);

                // RATE LIMITING PROGRESIVO: 
                // 3 intentos fallidos = 5 minutos de bloqueo. 5+ intentos = 30 minutos.
                if(attempts >= 5){
                    localStorage.setItem(LOCK_KEY, now + 1800000); // 30 min
                    document.getElementById('errorMsg').textContent = "Demasiados intentos. Bloqueo de 30 minutos aplicado.";
                } else if(attempts >= 3){
                    localStorage.setItem(LOCK_KEY, now + 300000); // 5 min
                    document.getElementById('errorMsg').textContent = "Alerta de fuerza bruta. Bloqueo de 5 minutos.";
                } else {
                    document.getElementById('errorMsg').textContent = `Credenciales incorrectas. Intentos: ${attempts}/5`;
                }
                _showErr();
            }
        }

        function _showErr(){
            const err = document.getElementById('errorMsg');
            err.style.display = 'block';
            setTimeout(() => { err.style.display = 'none'; }, 4000);
        }

        window.logoutAdmin = function(){
            document.getElementById('dashboardSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('adminUser').value = '';
            document.getElementById('adminPass').value = '';
        }

        function _renderDashboard(){
            let tickets = JSON.parse(localStorage.getItem(STORAGE_TICKETS) || '[]');
            let today = new Intl.DateTimeFormat('en-CA', { timeZone: "America/Caracas" }).format(new Date());
            let todayCount = tickets.filter(t => t.date === today).length;

            document.getElementById('tokenStats').textContent = `Tokens hoy: ${todayCount} / 25`;

            const container = document.getElementById('ticketListContainer');
            container.innerHTML = '';

            if(tickets.length === 0){
                container.innerHTML = '<p style="color:#666; font-size:13px; text-align:center; padding:20px;">No hay solicitudes registradas.</p>';
                return;
            }

            tickets.sort((a, b) => b.timestamp - a.timestamp);

            tickets.forEach(ticket => {
                const card = document.createElement('div');
                card.className = 'ticket-card';

                let msgsHtml = '';
                ticket.messages.forEach(m => {
                    msgsHtml += `<div style="font-size:12px; color:${m.sender==='client'?'#fff':'#ff8888'}"><b>${m.sender.toUpperCase()}:</b> ${_escapeHtml(m.text)}</div>`;
                });

                card.innerHTML = `
                    <div class="ticket-info">
                        <span><b>ID:</b> ${ticket.id} | <b>Fecha:</b> ${ticket.date}</span>
                        <span class="badge ${ticket.status}">${ticket.status.toUpperCase()}</span>
                    </div>
                    <div class="ticket-msgs" id="msgs-${ticket.id}">${msgsHtml}</div>
                    <div class="ticket-actions">
                        <input type="text" id="reply-${ticket.id}" placeholder="Responder como Admin..." onkeypress="handleAdminKey(event, '${ticket.id}')">
                        <button onclick="adminReply('${ticket.id}')">Enviar</button>
                        <button style="background:${ticket.status==='open'?'#441111':'#222'}" onclick="toggleTicketStatus('${ticket.id}')">
                            ${ticket.status==='open'?'Cerrar':'Abrir'}
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.adminReply = function(ticketId){
            const input = document.getElementById(`reply-${ticketId}`);
            const txt = input.value.trim();
            if(!txt) return;

            let tickets = JSON.parse(localStorage.getItem(STORAGE_TICKETS) || '[]');
            let ticket = tickets.find(t => t.id === ticketId);
            if(!ticket) return;

            ticket.messages.push({ sender: 'admin', text: txt, time: new Date().toLocaleTimeString() });
            ticket.timestamp = Date.now();

            localStorage.setItem(STORAGE_TICKETS, JSON.stringify(tickets));
            input.value = '';
            _renderDashboard();
        }

        window.handleAdminKey = function(e, ticketId){
            if(e.key === 'Enter') adminReply(ticketId);
        }

        window.toggleTicketStatus = function(ticketId){
            let tickets = JSON.parse(localStorage.getItem(STORAGE_TICKETS) || '[]');
            let ticket = tickets.find(t => t.id === ticketId);
            if(!ticket) return;

            ticket.status = ticket.status === 'open' ? 'closed' : 'open';
            ticket.timestamp = Date.now();
            localStorage.setItem(STORAGE_TICKETS, JSON.stringify(tickets));
            _renderDashboard();
        }

        function _escapeHtml(text){
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        setInterval(() => {
            if(document.getElementById('dashboardSection').style.display === 'block'){
                const activeEl = document.activeElement;
                if(activeEl && activeEl.id && activeEl.id.startsWith('reply-')) return;
                _renderDashboard();
            }
        }, 1500);
    })();
</script>
</body>
</html>
