<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
    <title>Cyt3rTools | Panel de Control</title>
    <style>
        :root {
            --bg: #0a0000;
            --bg2: #0d0000;
            --card: #110000;
            --border: #330000;
            --red: #cc0000;
            --red-glow: rgba(204,0,0,.3);
            --darkred: #880000;
            --text: #cccccc;
            --text-dim: #666;
            --white: #ffffff;
            --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
            --font: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); color: var(--text);
            font-family: var(--font); line-height: 1.6;
            min-height: 100vh; overflow-x: hidden;
        }
        ::selection { background: var(--red); color: #fff; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--red); }

        /* ===== LOGIN ===== */
        .login-wrapper {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 20px; position: relative;
        }
        .login-wrapper::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(204,0,0,.03) 0%, transparent 60%);
            pointer-events: none;
        }
        .login-box {
            width: 100%; max-width: 400px;
            background: var(--card); border: 1px solid var(--border);
            padding: 50px 40px; position: relative; z-index: 1;
            animation: loginFade .6s ease;
        }
        @keyframes loginFade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .login-box .lock-icon { text-align: center; font-size: 40px; margin-bottom: 10px; opacity: .5; }
        .login-box h2 {
            color: var(--red); font-size: 18px; text-align: center;
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px;
        }
        .login-box .login-subtitle {
            text-align: center; font-size: 11px; color: var(--text-dim);
            font-family: var(--mono); margin-bottom: 30px;
        }
        .login-box .login-line {
            width: 40px; height: 1px; background: var(--border);
            margin: 15px auto 25px;
        }
        .login-box .input-group {
            position: relative; margin-bottom: 18px;
        }
        .login-box .input-group label {
            font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px;
            color: var(--text-dim); display: block; margin-bottom: 6px;
            font-family: var(--mono);
        }
        .login-box input {
            width: 100%; background: #080000; border: 1px solid var(--border);
            padding: 12px 15px; color: #fff; font-size: 13px; outline: none;
            user-select: text; transition: all .3s;
        }
        .login-box input:focus { border-color: var(--red); box-shadow: 0 0 15px rgba(204,0,0,.1); }
        .login-box button {
            width: 100%; background: linear-gradient(135deg, var(--red), var(--darkred));
            border: none; color: #fff; padding: 13px; font-weight: 700;
            text-transform: uppercase; cursor: pointer; font-size: 12px;
            letter-spacing: 2px; transition: all .3s; margin-top: 5px;
        }
        .login-box button:hover { opacity: .85; box-shadow: 0 0 25px var(--red-glow); }
        .error-msg {
            color: var(--red); font-size: 11px; margin-top: 12px;
            display: none; font-family: var(--mono); text-align: center;
        }

        /* ===== DASHBOARD ===== */
        .dash-container {
            max-width: 1100px; margin: 0 auto; padding: 30px 20px;
        }
        .dash-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); padding-bottom: 18px;
            margin-bottom: 25px; flex-wrap: wrap; gap: 15px;
        }
        .dash-header h2 {
            color: var(--red); font-size: 18px; text-transform: uppercase;
            letter-spacing: 1px; font-family: var(--mono);
        }
        .dash-header h2 span { color: var(--text-dim); }
        .dash-header-right { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

        /* ===== STAT CARDS ===== */
        .stat-cards {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 2px; margin-bottom: 25px;
            background: var(--border); border: 1px solid var(--border);
        }
        .stat-card {
            background: var(--card); padding: 20px; text-align: center;
        }
        .stat-card .stat-card-num {
            font-family: var(--mono); font-size: 28px; font-weight: 900;
            color: var(--red); margin-bottom: 4px;
        }
        .stat-card .stat-card-label {
            font-size: 10px; text-transform: uppercase; color: var(--text-dim);
            letter-spacing: 1.5px;
        }

        /* ===== TICKET LIST ===== */
        .ticket-list { display: flex; flex-direction: column; gap: 2px; }
        .ticket-card {
            background: #0d0000; border: 1px solid var(--border);
            padding: 20px; transition: all .3s;
        }
        .ticket-card:hover { border-color: #440000; }
        .ticket-info {
            display: flex; justify-content: space-between; font-size: 11px;
            color: #777; border-bottom: 1px solid var(--border);
            padding-bottom: 8px; margin-bottom: 10px; flex-wrap: wrap; gap: 8px;
        }
        .ticket-info b { color: #999; }
        .ticket-msgs {
            max-height: 200px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 6px;
            padding: 10px 0; user-select: text;
        }
        .ticket-msgs .t-msg { font-size: 12px; padding: 6px 10px; }
        .ticket-msgs .t-msg.client { color: #fff; border-left: 2px solid var(--red); background: #180000; }
        .ticket-msgs .t-msg.admin { color: #ff8888; border-left: 2px solid var(--white); background: #220000; }
        .ticket-actions {
            display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap;
        }
        .ticket-actions input {
            flex: 1; min-width: 120px;
            background: #080000; border: 1px solid var(--border);
            padding: 9px 12px; color: #fff; font-size: 12px; outline: none;
            user-select: text; transition: border-color .3s;
        }
        .ticket-actions input:focus { border-color: var(--red); }
        .badge {
            padding: 3px 8px; font-size: 9px; text-transform: uppercase;
            font-weight: 700; letter-spacing: .5px;
        }
        .badge.open { background: #220000; color: #ff4444; border: 1px solid var(--red); }
        .badge.closed { background: #111; color: #555; border: 1px solid #222; }

        .btn {
            padding: 9px 16px; border: 1px solid var(--border);
            font-weight: 700; font-size: 10px; text-transform: uppercase;
            letter-spacing: 1px; cursor: pointer; transition: all .3s;
            background: transparent; color: var(--text-dim);
        }
        .btn:hover { border-color: var(--red); color: var(--red); }
        .btn-danger { border-color: var(--red); color: var(--red); }
        .btn-danger:hover { background: var(--red); color: #fff; }
        .btn-primary { background: var(--red); color: #fff; border-color: var(--red); }
        .btn-primary:hover { background: var(--darkred); }

        .empty-state {
            text-align: center; padding: 50px 20px; color: #444; font-family: var(--mono); font-size: 13px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .login-box { padding: 30px 25px; }
            .dash-header { flex-direction: column; align-items: stretch; text-align: center; }
            .dash-header-right { justify-content: center; }
            .stat-cards { grid-template-columns: repeat(2, 1fr); }
            .ticket-info { flex-direction: column; }
        }
        @media (max-width: 480px) {
            .stat-cards { grid-template-columns: 1fr 1fr; gap: 2px; }
            .stat-card { padding: 15px; }
            .stat-card .stat-card-num { font-size: 22px; }
        }
    </style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div class="login-wrapper" id="loginSection">
    <div class="login-box">
        <div class="lock-icon">&#128274;</div>
        <h2>Panel de Control</h2>
        <p class="login-subtitle">// Portal Administrativo Seguro</p>
        <div class="login-line"></div>
        <div class="input-group">
            <label>Usuario</label>
            <input type="text" id="adminUser" placeholder="Ingrese usuario" autocomplete="off">
        </div>
        <div class="input-group">
            <label>Contraseña</label>
            <input type="password" id="adminPass" placeholder="Ingrese contraseña">
        </div>
        <button onclick="authAdmin()">Acceder al Panel</button>
        <div id="errorMsg" class="error-msg">Acceso denegado. IP registrada.</div>
    </div>
</div>

<!-- ===== DASHBOARD ===== -->
<div id="dashboardSection" class="dash-container" style="display:none;">
    <div class="dash-header">
        <h2>&#9654; Panel <span>de Control</span></h2>
        <div class="dash-header-right">
            <div class="btn" id="tokenStats" style="cursor:default; border-color:#222;">Tokens hoy: 0 / 25</div>
            <button class="btn btn-danger" onclick="logoutAdmin()">&#9654; Salir</button>
        </div>
    </div>

    <!-- STATS -->
    <div class="stat-cards">
        <div class="stat-card"><div class="stat-card-num" id="statOpen">0</div><div class="stat-card-label">Abiertos</div></div>
        <div class="stat-card"><div class="stat-card-num" id="statClosed">0</div><div class="stat-card-label">Cerrados</div></div>
        <div class="stat-card"><div class="stat-card-num" id="statTotal">0</div><div class="stat-card-label">Totales</div></div>
        <div class="stat-card"><div class="stat-card-num" id="statToday">0</div><div class="stat-card-label">Hoy</div></div>
    </div>

    <!-- SEARCH -->
    <div style="margin-bottom: 15px;">
        <input type="text" id="ticketSearch" placeholder="Buscar ticket por ID..." style="width:100%; max-width:300px; background:#080000; border:1px solid var(--border); padding:10px 14px; color:#fff; font-size:12px; outline:none; transition:border-color .3s;" oninput="filterTickets(this.value)">
    </div>

    <!-- TICKET LIST -->
    <div class="ticket-list" id="ticketListContainer"></div>
</div>
